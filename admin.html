<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroTask - Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8F7F2; }
  </style>
</head>
<body class="text-zinc-900 min-h-screen p-4 sm:p-8">
  
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <header class="flex justify-between items-center mb-8 bg-white p-5 rounded-2xl shadow-sm border border-zinc-200">
      <div>
        <h1 class="text-2xl font-extrabold text-[#7357D8]">⚡ Admin Dashboard</h1>
        <p class="text-xs text-zinc-500 font-semibold mt-1">Review proofs & approve payouts</p>
      </div>
      <span id="admin-status" class="text-xs font-bold bg-[#FFD84D] text-zinc-900 px-3 py-1.5 rounded-full shadow-sm">
        Verifying Admin...
      </span>
    </header>

    <!-- Submissions Card -->
    <div class="bg-white border border-zinc-200 rounded-2xl p-6 shadow-sm">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-zinc-900">📋 Pending Submissions</h2>
        <button onclick="loadPendingSubmissions()" class="text-xs font-bold text-[#7357D8] hover:underline">
          🔄 Refresh
        </button>
      </div>

      <div id="submissions-list" class="overflow-x-auto">
        <p class="text-zinc-400 text-sm">Checking for submissions...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase.js';

    async function checkAdminAndLoad() {
      const userId = localStorage.getItem('rem_user_id');
      
      if (!userId) {
        alert('Please login first on the user page!');
        window.location.href = 'index.html';
        return;
      }

      const { data: profile, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', userId)
        .maybeSingle();

      if (error || !profile || !profile.is_admin) {
        alert('Access Denied! You are not marked as Admin in Supabase.');
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('admin-status').innerText = `Admin: ${profile.mobile || 'Verified'}`;
      loadPendingSubmissions();
    }

    window.loadPendingSubmissions = async function() {
      const container = document.getElementById('submissions-list');
      container.innerHTML = `<p class="text-zinc-400 text-sm">Loading pending proofs...</p>`;

      const { data: subs, error } = await supabase
        .from('submissions')
        .select(`
          id,
          proof_text,
          screenshot_url,
          created_at,
          profiles (mobile, upi_id),
          tasks (title, reward_amount)
        `)
        .eq('status', 'pending')
        .order('created_at', { ascending: false });

      if (error || !subs || subs.length === 0) {
        container.innerHTML = `<p class="text-zinc-400 text-sm py-4">No pending submissions found. All caught up! 🎉</p>`;
        return;
      }

      let html = `
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-zinc-200 text-zinc-500 text-xs font-bold">
              <th class="p-3">User</th>
              <th class="p-3">Task & Reward</th>
              <th class="p-3">Proof / Note</th>
              <th class="p-3">Screenshot</th>
              <th class="p-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-zinc-100 text-sm">
      `;

      subs.forEach(sub => {
        html += `
          <tr class="hover:bg-zinc-50">
            <td class="p-3">
              <div class="font-bold text-zinc-900">${sub.profiles?.mobile || 'User'}</div>
              <div class="text-xs text-zinc-400 font-semibold">${sub.profiles?.upi_id || 'No UPI'}</div>
            </td>
            <td class="p-3">
              <div class="font-bold text-zinc-800">${sub.tasks?.title || 'Task'}</div>
              <span class="inline-block bg-[#EDE9FE] text-[#7357D8] text-xs font-extrabold px-2 py-0.5 rounded mt-0.5">
                +₹${sub.tasks?.reward_amount || 0}
              </span>
            </td>
            <td class="p-3 text-xs text-zinc-600 max-w-xs">
              ${sub.proof_text || '<span class="text-zinc-400 italic">No note provided</span>'}
            </td>
            <td class="p-3">
              <a href="${sub.screenshot_url}" target="_blank" class="inline-flex items-center text-xs font-bold text-[#7357D8] bg-[#F3F0FF] hover:bg-[#EDE9FE] px-2.5 py-1.5 rounded-lg border border-[#DDD6FE]">
                🔍 View Proof
              </a>
            </td>
            <td class="p-3 text-right">
              <button onclick="approveTask('${sub.id}')" class="bg-[#FFD84D] hover:bg-[#FACC15] text-zinc-900 px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-sm transition">
                Approve & Pay ⚡
              </button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    };

    window.approveTask = async function(subId) {
      if (!confirm("Are you sure you want to approve this task and credit wallet?")) return;

      const { error } = await supabase.rpc('approve_submission', { sub_id: subId });
      if (error) {
        alert('Error approving task: ' + error.message);
      } else {
        alert('Task Approved! Balance credited to user wallet. 🚀');
        loadPendingSubmissions();
      }
    };

    checkAdminAndLoad();
  </script>
</body>
</html>
