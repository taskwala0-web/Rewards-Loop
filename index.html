<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MicroTask Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Modern Dark Theme CSS */
        :root {
            --bg: #121212; --surface: #1e1e1e; --primary: #00e676; 
            --text: #ffffff; --text-sec: #aaaaaa; --border: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 50; }
        .logo { font-weight: 800; font-size: 1.2rem; color: var(--primary); }
        .wallet-chip { background: #2d3748; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: 1px solid var(--primary); }
        
        .container { padding: 20px; max-width: 600px; margin: auto; }
        
        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: var(--surface); padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, select { width: 100%; padding: 14px; margin-top: 12px; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 8px; font-size: 1rem; }
        input:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 14px; margin-top: 15px; background: var(--primary); color: #000; border: none; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: white; }
        
        /* Task Cards */
        .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 15px; transition: transform 0.2s; }
        .task-card:active { transform: scale(0.98); }
        .badge { background: #2d3748; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; color: var(--primary); margin-bottom: 10px; display: inline-block; font-weight: 600; }
        .task-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
        .task-payout { font-size: 1.2rem; font-weight: 800; color: var(--primary); float: right; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-half { flex: 1; padding: 10px; font-size: 0.9rem; }
        
        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 15px 0; z-index: 50; }
        .nav-item { color: var(--text-sec); font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--primary); }
        
        /* Status Badges */
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .status-pending { background: #332b00; color: #ffeb3b; }
        .status-approved { background: #003314; color: #00e676; }
        .status-paid { background: #003314; color: #00e676; }
        .status-rejected { background: #330000; color: #ff5252; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ TaskReward</div>
        <div class="wallet-chip" id="walletChip" onclick="openWithdrawModal()">Wallet: ₹0</div>
    </header>

    <div class="container" id="mainContent">
        <h3 style="margin-bottom: 15px;">Available Offers</h3>
        <div id="tasksContainer">Loading tasks...</div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" id="navTasks" onclick="loadTasks()">
            <span>📋</span> Tasks
        </div>
        <div class="nav-item" id="navStatus" onclick="loadStatus()">
            <span>🕒</span> Status
        </div>
    </div>

    <!-- Auth Modal (Mobile + PIN Login/Register) -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <h2 id="authTitle" style="margin-bottom: 5px;">Welcome!</h2>
            <p style="color: var(--text-sec); font-size: 0.9rem; margin-bottom: 15px;">Login or create a new account.</p>
            
            <input type="number" id="authMobile" placeholder="10-digit Mobile Number" required>
            <input type="text" id="authName" placeholder="Full Name (Leave blank if old user)">
            <input type="password" id="authPin" placeholder="4-Digit PIN" maxlength="4" required>
            
            <button id="btnAuth" onclick="handleAuth()">Continue</button>
        </div>
    </div>

    <!-- Submit Proof Modal -->
    <div class="modal" id="submitModal">
        <div class="modal-content">
            <h2>Submit Proof</h2>
            <p id="submitTaskName" style="color: var(--primary); margin: 10px 0 15px 0; font-weight: 600;"></p>
            
            <label style="font-size: 0.85rem; color: var(--text-sec);">Upload Screenshot (Max 5MB)</label>
            <input type="file" id="proofImage" accept="image/*">
            
            <label style="font-size: 0.85rem; color: var(--text-sec); margin-top: 15px; display: block;">Optional Note / Username</label>
            <input type="text" id="proofText" placeholder="e.g. Registered with username abc">

            <label style="font-size: 0.85rem; color: var(--text-sec); margin-top: 15px; display: block;">Payout UPI ID</label>
            <input type="text" id="upiId" placeholder="e.g. 9876543210@ybl">
            
            <button id="btnSubmitProof" onclick="submitProof()">Upload & Submit</button>
            <button class="btn-outline" onclick="closeModal('submitModal')">Cancel</button>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div class="modal" id="withdrawModal">
        <div class="modal-content">
            <h2>Withdraw to UPI</h2>
            <p style="color: var(--text-sec); font-size: 0.9rem; margin-bottom: 15px;">Minimum withdrawal is ₹50.</p>
            
            <input type="number" id="wdAmount" placeholder="Amount (Min ₹50)">
            <input type="text" id="wdUpi" placeholder="Your UPI ID">
            
            <button id="btnWithdraw" onclick="requestWithdraw()">Withdraw ⚡</button>
            <button class="btn-outline" onclick="closeModal('withdrawModal')">Close</button>
        </div>
    </div>

<script type="module">
    import { supabase } from './supabase.js';

    // Google Apps Script endpoint for image upload only
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYlo3d5R9QSN1ocHuyD-H75vwXfwD2j_CvisRC7QvMe_GBQ0g9jeZx-L5ppZD6rqVsXg/exec'; 
    let currentTaskId = null;
    let currentUserProfile = null;

    window.closeModal = function(modalId) {
        document.getElementById(modalId).style.display = 'none';
    };

    window.openWithdrawModal = function() {
        const bal = parseFloat(currentUserProfile?.wallet_balance || 0);
        document.getElementById('wdAmount').value = bal;
        document.getElementById('wdUpi').value = currentUserProfile?.upi_id || localStorage.getItem('rem_upi') || '';
        
        const btn = document.getElementById('btnWithdraw');
        if (bal < 50) {
            btn.disabled = true;
            btn.innerText = "Min Withdraw ₹50";
        } else {
            btn.disabled = false;
            btn.innerText = `Withdraw ₹${bal} ⚡`;
        }
        document.getElementById('withdrawModal').style.display = 'flex';
    };

    window.openSubmitModal = function(taskId, taskName) {
        currentTaskId = taskId;
        document.getElementById('submitTaskName').innerText = taskName;
        document.getElementById('upiId').value = currentUserProfile?.upi_id || localStorage.getItem('rem_upi') || '';
        document.getElementById('submitModal').style.display = 'flex';
    };

    window.openLink = function(link) {
        window.open(link, '_blank');
    };

    function updateWalletUI(bal) {
        document.getElementById('walletChip').innerText = `Wallet: ₹${bal}`;
    }

    // AUTHENTICATION (Mobile + PIN with Supabase)
    window.handleAuth = async function() {
        const mobile = document.getElementById('authMobile').value.trim();
        const name = document.getElementById('authName').value.trim();
        const pin = document.getElementById('authPin').value.trim();
        
        if (mobile.length !== 10) return alert("Please enter a valid 10-digit mobile number.");
        if (pin.length !== 4) return alert("Please enter a 4-digit PIN.");
        
        const btn = document.getElementById('btnAuth');
        btn.innerText = "Please wait...";
        btn.disabled = true;

        try {
            // Check if profile exists
            let { data: profile, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('mobile', mobile)
                .maybeSingle();

            if (!profile) {
                // Register new user
                const newId = crypto.randomUUID();
                const { data: inserted, error: insertErr } = await supabase
                    .from('profiles')
                    .insert([{
                        id: newId,
                        mobile: mobile,
                        full_name: name || 'User ' + mobile.slice(-4),
                        pin: pin,
                        wallet_balance: 0.00
                    }])
                    .select()
                    .single();

                if (insertErr) throw insertErr;
                profile = inserted;
            } else {
                // Login check
                if (profile.pin !== pin) {
                    alert("Incorrect PIN. Please try again.");
                    btn.innerText = "Continue";
                    btn.disabled = false;
                    return;
                }
            }

            currentUserProfile = profile;
            localStorage.setItem('rem_user_id', profile.id);
            localStorage.setItem('rem_mobile', profile.mobile);
            
            closeModal('authModal');
            updateWalletUI(profile.wallet_balance || 0);
            loadTasks();
        } catch (err) {
            console.error(err);
            alert("Auth error: " + (err.message || "Failed to authenticate"));
        } finally {
            btn.innerText = "Continue";
            btn.disabled = false;
        }
    };

    // LOAD ACTIVE TASKS FROM SUPABASE
    window.loadTasks = async function() {
        document.getElementById('navTasks').classList.add('active');
        document.getElementById('navStatus').classList.remove('active');
        
        const container = document.getElementById('mainContent');
        container.innerHTML = `<h3 style="margin-bottom: 15px;">Available Offers</h3><div id="tasksContainer">Loading tasks...</div>`;
        const taskDiv = document.getElementById('tasksContainer');

        try {
            const { data: tasks, error } = await supabase
                .from('tasks')
                .select('*')
                .eq('is_active', true)
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (!tasks || tasks.length === 0) {
                taskDiv.innerHTML = "<p style='color: var(--text-sec);'>No active tasks right now. Check back later!</p>";
                return;
            }

            taskDiv.innerHTML = tasks.map(t => `
                <div class="task-card">
                    <div class="badge">${t.category}</div>
                    <span class="task-payout">₹${t.reward_amount}</span>
                    <div class="task-title">${t.title}</div>
                    <p style="font-size: 0.85rem; color: var(--text-sec); margin-bottom: 10px;">${t.description}</p>
                    <div class="btn-group">
                        <button class="btn-half" style="background: transparent; border: 1px solid var(--primary); color: var(--primary);" onclick="openLink('${t.action_url}')">Open Link</button>
                        <button class="btn-half" onclick="openSubmitModal('${t.id}', '${t.title}')">Submit Proof</button>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            console.error(e);
            taskDiv.innerHTML = "<p style='color: red;'>Failed to load tasks from database.</p>";
        }
    };

    // IMAGE COMPRESSION
    async function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let { width, height } = img;
                    const max = 1080;
                    if (width > height && width > max) { height *= max / width; width = max; } 
                    else if (height > max) { width *= max / height; height = max; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // SUBMIT PROOF (Upload to Drive Script -> Save to Supabase)
    window.submitProof = async function() {
        const fileInput = document.getElementById('proofImage');
        const proofText = document.getElementById('proofText').value.trim();
        const upi = document.getElementById('upiId').value.trim();
        
        if (!fileInput.files[0]) return alert("Please select a screenshot.");
        if (!upi) return alert("Please enter your UPI ID.");

        const btn = document.getElementById('btnSubmitProof');
        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            const base64Img = await compressImage(fileInput.files[0]);
            
            // 1. Upload screenshot to Drive via Google Apps Script
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'uploadOnly',
                    image: base64Img,
                    mobile: currentUserProfile.mobile
                })
            });
            const driveData = await res.json();
            const screenshotUrl = driveData.url || 'Uploaded via Script';

            // 2. Save submission directly into Supabase
            const { error: subErr } = await supabase
                .from('submissions')
                .insert([{
                    user_id: currentUserProfile.id,
                    task_id: currentTaskId,
                    proof_text: proofText,
                    screenshot_url: screenshotUrl,
                    status: 'pending'
                }]);

            if (subErr) throw subErr;

            // Save UPI ID to profile
            await supabase.from('profiles').update({ upi_id: upi }).eq('id', currentUserProfile.id);
            currentUserProfile.upi_id = upi;
            localStorage.setItem('rem_upi', upi);

            alert("Proof submitted successfully! Admin will review shortly.");
            closeModal('submitModal');
            loadStatus();
        } catch (err) {
            console.error(err);
            alert("Submission error: " + (err.message || "Failed to submit"));
        } finally {
            btn.innerText = "Upload & Submit";
            btn.disabled = false;
            fileInput.value = '';
        }
    };

    // STATUS HISTORY TRACKER (From Supabase)
    window.loadStatus = async function() {
        document.getElementById('navTasks').classList.remove('active');
        document.getElementById('navStatus').classList.add('active');
        
        const container = document.getElementById('mainContent');
        container.innerHTML = `<h3 style="margin-bottom: 15px;">Your Submissions</h3><div id="statusList">Loading history...</div>`;
        
        try {
            const { data: subs, error } = await supabase
                .from('submissions')
                .select(`
                    id,
                    status,
                    admin_comment,
                    created_at,
                    tasks (title, reward_amount)
                `)
                .eq('user_id', currentUserProfile.id)
                .order('created_at', { ascending: false });

            if (error) throw error;

            const list = document.getElementById('statusList');
            if (!subs || subs.length === 0) {
                list.innerHTML = "<p style='color: var(--text-sec);'>You haven't submitted any tasks yet.</p>";
                return;
            }

            list.innerHTML = subs.map(h => {
                const d = new Date(h.created_at);
                const formattedDate = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
                return `
                <div class="task-card">
                    <div style="display:flex; justify-content: space-between; align-items: flex-start;">
                        <b style="font-size: 1.05rem;">${h.tasks?.title || 'Task'}</b>
                        <span class="status-badge status-${h.status.toLowerCase()}">${h.status}</span>
                    </div>
                    <p style="font-size:0.8rem; margin-top:8px; color:var(--text-sec)">Submitted on: ${formattedDate}</p>
                    ${h.admin_comment ? `<p style="font-size:0.85rem; margin-top:8px; color:#ff5252; background: rgba(255,82,82,0.1); padding: 8px; border-radius: 4px;"><b>Note:</b> ${h.admin_comment}</p>` : ''}
                </div>
            `}).join('');
        } catch (e) {
            console.error(e);
            document.getElementById('statusList').innerHTML = "<p style='color: red;'>Failed to load status.</p>";
        }
    };

    // WITHDRAWAL ENGINE (Saved to Supabase)
    window.requestWithdraw = async function() {
        const amount = parseFloat(document.getElementById('wdAmount').value);
        const upi = document.getElementById('wdUpi').value.trim();
        
        if (amount < 50) return alert("Minimum withdrawal is ₹50.");
        if (!upi) return alert("Please enter UPI ID.");
        if (amount > (currentUserProfile.wallet_balance || 0)) return alert("Insufficient balance.");

        const btn = document.getElementById('btnWithdraw');
        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            // Deduct balance locally & add record
            const newBal = (currentUserProfile.wallet_balance || 0) - amount;
            
            await supabase.from('withdrawals').insert([{
                user_id: currentUserProfile.id,
                amount: amount,
                upi_id: upi,
                status: 'pending'
            }]);

            await supabase.from('profiles').update({ 
                wallet_balance: newBal, 
                upi_id: upi 
            }).eq('id', currentUserProfile.id);

            currentUserProfile.wallet_balance = newBal;
            updateWalletUI(newBal);

            alert("Withdrawal Requested Successfully!");
            closeModal('withdrawModal');
        } catch (err) {
            console.error(err);
            alert("Withdrawal failed: " + err.message);
        } finally {
            btn.innerText = "Withdraw ⚡";
            btn.disabled = false;
        }
    };

    // INITIAL LOAD CHECK
    window.onload = async () => {
        const savedId = localStorage.getItem('rem_user_id');
        if (!savedId) {
            document.getElementById('authModal').style.display = 'flex';
        } else {
            const { data: profile } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', savedId)
                .maybeSingle();

            if (profile) {
                currentUserProfile = profile;
                updateWalletUI(profile.wallet_balance || 0);
                loadTasks();
            } else {
                document.getElementById('authModal').style.display = 'flex';
            }
        }
    };
</script>
</body>
</html>
