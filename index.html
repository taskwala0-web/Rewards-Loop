<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MicroTask Rewards</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8F7F2;
            --surface: #FFFFFF;
            --primary: #7357D8;
            --primary-hover: #5d3fc8;
            --accent: #FFD84D;
            --text-main: #18181B;
            --text-sec: #71717A;
            --border: #E4E4E7;
            --card-shadow: 0 4px 20px -2px rgba(115, 87, 216, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding-bottom: 85px; min-height: 100vh; }

        /* Header */
        header { 
            padding: 16px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            background: var(--surface); 
            position: sticky; 
            top: 0; 
            z-index: 50; 
        }
        .logo { font-weight: 800; font-size: 1.25rem; color: var(--primary); letter-spacing: -0.5px; }
        .wallet-chip { 
            background: var(--accent); 
            color: #18181B; 
            padding: 7px 14px; 
            border-radius: 9999px; 
            font-weight: 700; 
            font-size: 0.9rem; 
            cursor: pointer; 
            box-shadow: 0 2px 6px rgba(255, 216, 77, 0.4); 
            transition: transform 0.15s ease;
        }
        .wallet-chip:active { transform: scale(0.95); }

        .container { padding: 20px 16px; max-width: 580px; margin: auto; }
        .section-title { font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin-bottom: 16px; }

        /* Modals */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(24, 24, 27, 0.6); 
            z-index: 100; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            backdrop-filter: blur(6px); 
        }
        .modal-content { 
            background: var(--surface); 
            padding: 24px; 
            border-radius: 18px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
            border: 1px solid var(--border);
        }
        .modal-content h2 { font-weight: 800; font-size: 1.35rem; color: var(--text-main); }

        input, select { 
            width: 100%; 
            padding: 13px 15px; 
            margin-top: 10px; 
            background: #FAFAFA; 
            border: 1.5px solid var(--border); 
            color: var(--text-main); 
            border-radius: 12px; 
            font-size: 0.95rem; 
            font-weight: 600;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); background: #FFF; }
        
        button { 
            width: 100%; 
            padding: 13px; 
            margin-top: 14px; 
            background: var(--primary); 
            color: #FFFFFF; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 0.95rem; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        button:hover { background: var(--primary-hover); }
        button:active { transform: scale(0.98); }
        button:disabled { background: #D4D4D8; color: #A1A1AA; cursor: not-allowed; }
        
        .btn-outline { 
            background: transparent; 
            border: 1.5px solid var(--border); 
            color: var(--text-sec); 
            margin-top: 8px; 
        }
        .btn-outline:hover { background: #F4F4F5; color: var(--text-main); }

        /* Task Cards */
        .task-card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 18px; 
            margin-bottom: 14px; 
            box-shadow: var(--card-shadow); 
            transition: transform 0.15s ease;
        }
        .badge { 
            background: rgba(115, 87, 216, 0.12); 
            padding: 4px 10px; 
            border-radius: 9999px; 
            font-size: 0.75rem; 
            color: var(--primary); 
            margin-bottom: 8px; 
            display: inline-block; 
            font-weight: 700; 
        }
        .task-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; color: var(--text-main); }
        .task-payout { 
            font-size: 1.25rem; 
            font-weight: 800; 
            color: var(--primary); 
            float: right; 
            background: #EDE9FE; 
            padding: 2px 10px; 
            border-radius: 8px; 
        }
        .task-desc { font-size: 0.88rem; color: var(--text-sec); line-height: 1.4; margin-bottom: 14px; }
        
        .btn-group { display: flex; gap: 10px; }
        .btn-half { flex: 1; padding: 11px; font-size: 0.9rem; margin-top: 0; }
        .btn-action { background: var(--accent); color: #18181B; }
        .btn-action:hover { background: #f5cc38; }

        /* Bottom Nav */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background: var(--surface); 
            border-top: 1px solid var(--border); 
            display: flex; 
            justify-content: space-around; 
            padding: 12px 0 14px 0; 
            z-index: 50; 
        }
        .nav-item { 
            color: var(--text-sec); 
            font-size: 0.85rem; 
            font-weight: 700; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
            transition: color 0.15s;
        }
        .nav-item.active { color: var(--primary); }

        /* Status Badges */
        .status-badge { padding: 4px 10px; border-radius: 9999px; font-size: 0.8rem; font-weight: 700; text-transform: capitalize; }
        .status-pending { background: #FEF3C7; color: #D97706; }
        .status-approved, .status-paid { background: #DCFCE7; color: #15803D; }
        .status-rejected { background: #FEE2E2; color: #B91C1C; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ TaskReward</div>
        <div class="wallet-chip" id="walletChip" onclick="openWithdrawModal()">Wallet: ₹0</div>
    </header>

    <div class="container" id="mainContent">
        <h3 class="section-title">Available Offers</h3>
        <div id="tasksContainer"><p style="color: var(--text-sec);">Loading tasks...</p></div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" id="navTasks" onclick="loadTasks()">
            <span style="font-size: 1.1rem;">📋</span> Tasks
        </div>
        <div class="nav-item" id="navStatus" onclick="loadStatus()">
            <span style="font-size: 1.1rem;">🕒</span> Status
        </div>
    </div>

    <!-- Auth Modal (Mobile + PIN) -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <h2>Welcome! 👋</h2>
            <p style="color: var(--text-sec); font-size: 0.9rem; margin-top: 4px; margin-bottom: 14px;">Login or create your account</p>
            
            <input type="tel" id="authMobile" placeholder="10-digit Mobile Number" maxlength="10" required>
            <input type="text" id="authName" placeholder="Full Name (Leave blank if old user)">
            <input type="password" id="authPin" placeholder="4-Digit PIN" maxlength="4" required>
            
            <button id="btnAuth" onclick="handleAuth()">Continue ⚡</button>
        </div>
    </div>

    <!-- Submit Proof Modal -->
    <div class="modal" id="submitModal">
        <div class="modal-content">
            <h2>Submit Proof</h2>
            <p id="submitTaskName" style="color: var(--primary); margin: 6px 0 14px 0; font-weight: 700; font-size: 0.95rem;"></p>
            
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-sec);">Upload Screenshot (Max 5MB)</label>
            <input type="file" id="proofImage" accept="image/*">
            
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-sec); margin-top: 14px; display: block;">Optional Note / Username</label>
            <input type="text" id="proofText" placeholder="e.g. Registered with username abc">

            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-sec); margin-top: 14px; display: block;">Payout UPI ID</label>
            <input type="text" id="upiId" placeholder="e.g. 9876543210@ybl">
            
            <button id="btnSubmitProof" class="btn-action" onclick="submitProof()">Upload & Submit Proof</button>
            <button class="btn-outline" onclick="closeModal('submitModal')">Cancel</button>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div class="modal" id="withdrawModal">
        <div class="modal-content">
            <h2>Withdraw to UPI</h2>
            <p style="color: var(--text-sec); font-size: 0.9rem; margin: 4px 0 14px 0;">Minimum withdrawal is ₹50.</p>
            
            <input type="number" id="wdAmount" placeholder="Amount (Min ₹50)">
            <input type="text" id="wdUpi" placeholder="Your UPI ID">
            
            <button id="btnWithdraw" class="btn-action" onclick="requestWithdraw()">Withdraw ⚡</button>
            <button class="btn-outline" onclick="closeModal('withdrawModal')">Close</button>
        </div>
    </div>

<script type="module">
    import { supabase } from './supabase.js';

    let currentTaskId = null;
    let currentUserProfile = null;

    window.closeModal = function(modalId) {
        document.getElementById(modalId).style.display = 'none';
    };

    window.openWithdrawModal = function() {
        const bal = parseFloat(currentUserProfile?.wallet_balance || 0);
        document.getElementById('wdAmount').value = bal;
        document.getElementById('wdUpi').value = currentUserProfile?.upi_id || localStorage.getItem('rem_upi') || '';
        
        const btn = document.getElementById('btnWithdraw');
        if (bal < 50) {
            btn.disabled = true;
            btn.innerText = "Min Withdraw ₹50";
        } else {
            btn.disabled = false;
            btn.innerText = `Withdraw ₹${bal} ⚡`;
        }
        document.getElementById('withdrawModal').style.display = 'flex';
    };

    window.openSubmitModal = function(taskId, taskName) {
        currentTaskId = taskId;
        document.getElementById('submitTaskName').innerText = taskName;
        document.getElementById('upiId').value = currentUserProfile?.upi_id || localStorage.getItem('rem_upi') || '';
        document.getElementById('submitModal').style.display = 'flex';
    };

    window.openLink = function(link) {
        window.open(link, '_blank');
    };

    function updateWalletUI(bal) {
        document.getElementById('walletChip').innerText = `Wallet: ₹${bal}`;
    }

    // AUTHENTICATION (Mobile + PIN)
    window.handleAuth = async function() {
        const mobile = document.getElementById('authMobile').value.trim();
        const name = document.getElementById('authName').value.trim();
        const pin = document.getElementById('authPin').value.trim();
        
        if (mobile.length !== 10) return alert("Please enter a valid 10-digit mobile number.");
        if (pin.length !== 4) return alert("Please enter a 4-digit PIN.");
        
        const btn = document.getElementById('btnAuth');
        btn.innerText = "Verifying...";
        btn.disabled = true;

        try {
            let { data: profile, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('mobile', mobile)
                .maybeSingle();

            if (!profile) {
                const { data: inserted, error: insertErr } = await supabase
                    .from('profiles')
                    .insert([{
                        mobile: mobile,
                        full_name: name || 'User ' + mobile.slice(-4),
                        pin: pin,
                        wallet_balance: 0.00
                    }])
                    .select()
                    .single();

                if (insertErr) throw insertErr;
                profile = inserted;
            } else {
                if (profile.pin !== pin) {
                    alert("Incorrect PIN! Please try again.");
                    btn.innerText = "Continue ⚡";
                    btn.disabled = false;
                    return;
                }
            }

            currentUserProfile = profile;
            localStorage.setItem('rem_user_id', profile.id);
            localStorage.setItem('rem_mobile', profile.mobile);
            
            closeModal('authModal');
            updateWalletUI(profile.wallet_balance || 0);
            loadTasks();
        } catch (err) {
            console.error(err);
            alert("Auth error: " + (err.message || "Failed to authenticate"));
        } finally {
            btn.innerText = "Continue ⚡";
            btn.disabled = false;
        }
    };

    // LOAD ACTIVE TASKS
    window.loadTasks = async function() {
        document.getElementById('navTasks').classList.add('active');
        document.getElementById('navStatus').classList.remove('active');
        
        const container = document.getElementById('mainContent');
        container.innerHTML = `<h3 class="section-title">Available Offers</h3><div id="tasksContainer"><p style="color: var(--text-sec);">Loading tasks...</p></div>`;
        const taskDiv = document.getElementById('tasksContainer');

        try {
            const { data: tasks, error } = await supabase
                .from('tasks')
                .select('*')
                .eq('is_active', true)
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (!tasks || tasks.length === 0) {
                taskDiv.innerHTML = "<p style='color: var(--text-sec);'>No active tasks right now. Check back later!</p>";
                return;
            }

            taskDiv.innerHTML = tasks.map(t => `
                <div class="task-card">
                    <span class="task-payout">₹${t.reward_amount}</span>
                    <div class="badge">${t.category}</div>
                    <div class="task-title">${t.title}</div>
                    <p class="task-desc">${t.description}</p>
                    <div class="btn-group">
                        <button class="btn-half btn-outline" onclick="openLink('${t.action_url}')">Open Link</button>
                        <button class="btn-half btn-action" onclick="openSubmitModal('${t.id}', '${t.title}')">Submit Proof</button>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            console.error(e);
            taskDiv.innerHTML = "<p style='color: #EF4444;'>Failed to load tasks from database.</p>";
        }
    };

    // SUBMIT PROOF (Supabase Storage Direct Upload)
    window.submitProof = async function() {
        const fileInput = document.getElementById('proofImage');
        const proofText = document.getElementById('proofText').value.trim();
        const upi = document.getElementById('upiId').value.trim();
        
        if (!fileInput.files[0]) return alert("Please select a screenshot.");
        if (!upi) return alert("Please enter your UPI ID.");

        const btn = document.getElementById('btnSubmitProof');
        btn.innerText = "Uploading Proof...";
        btn.disabled = true;

        try {
            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${currentUserProfile.mobile}_${Date.now()}.${fileExt}`;

            // 1. Direct upload to Supabase Storage bucket 'proofs'
            const { error: uploadErr } = await supabase.storage
                .from('proofs')
                .upload(fileName, file, { cacheControl: '3600', upsert: false });

            if (uploadErr) throw uploadErr;

            // 2. Get Public URL
            const { data: urlData } = supabase.storage
                .from('proofs')
                .getPublicUrl(fileName);

            const screenshotUrl = urlData.publicUrl;

            // 3. Save submission into Supabase Database
            const { error: subErr } = await supabase
                .from('submissions')
                .insert([{
                    user_id: currentUserProfile.id,
                    task_id: currentTaskId,
                    proof_text: proofText,
                    screenshot_url: screenshotUrl,
                    status: 'pending'
                }]);

            if (subErr) throw subErr;

            await supabase.from('profiles').update({ upi_id: upi }).eq('id', currentUserProfile.id);
            currentUserProfile.upi_id = upi;
            localStorage.setItem('rem_upi', upi);

            alert("Proof submitted successfully! Admin will review shortly.");
            closeModal('submitModal');
            loadStatus();
        } catch (err) {
            console.error(err);
            alert("Submission error: " + (err.message || "Failed to submit"));
        } finally {
            btn.innerText = "Upload & Submit Proof";
            btn.disabled = false;
            fileInput.value = '';
        }
    };

    // LOAD SUBMISSION STATUS
    window.loadStatus = async function() {
        document.getElementById('navTasks').classList.remove('active');
        document.getElementById('navStatus').classList.add('active');
        
        const container = document.getElementById('mainContent');
        container.innerHTML = `<h3 class="section-title">Your Submissions</h3><div id="statusList"><p style="color: var(--text-sec);">Loading your history...</p></div>`;
        
        try {
            const { data: subs, error } = await supabase
                .from('submissions')
                .select(`
                    id,
                    status,
                    admin_comment,
                    created_at,
                    tasks (title, reward_amount)
                `)
                .eq('user_id', currentUserProfile.id)
                .order('created_at', { ascending: false });

            if (error) throw error;

            const list = document.getElementById('statusList');
            if (!subs || subs.length === 0) {
                list.innerHTML = "<p style='color: var(--text-sec);'>You haven't submitted any tasks yet.</p>";
                return;
            }

            list.innerHTML = subs.map(h => {
                const d = new Date(h.created_at);
                const formattedDate = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
                return `
                <div class="task-card">
                    <div style="display:flex; justify-content: space-between; align-items: flex-start;">
                        <b style="font-size: 1.05rem; color: var(--text-main);">${h.tasks?.title || 'Task'}</b>
                        <span class="status-badge status-${h.status.toLowerCase()}">${h.status}</span>
                    </div>
                    <p style="font-size:0.8rem; margin-top:8px; color:var(--text-sec)">Submitted on: ${formattedDate}</p>
                    ${h.admin_comment ? `<p style="font-size:0.85rem; margin-top:8px; color:#DC2626; background: #FEE2E2; padding: 8px 12px; border-radius: 8px;"><b>Admin Note:</b> ${h.admin_comment}</p>` : ''}
                </div>
            `}).join('');
        } catch (e) {
            console.error(e);
            document.getElementById('statusList').innerHTML = "<p style='color: #EF4444;'>Failed to load status.</p>";
        }
    };

    // REQUEST WITHDRAWAL
    window.requestWithdraw = async function() {
        const amount = parseFloat(document.getElementById('wdAmount').value);
        const upi = document.getElementById('wdUpi').value.trim();
        
        if (amount < 50) return alert("Minimum withdrawal is ₹50.");
        if (!upi) return alert("Please enter UPI ID.");
        if (amount > (currentUserProfile.wallet_balance || 0)) return alert("Insufficient balance.");

        const btn = document.getElementById('btnWithdraw');
        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            const newBal = (currentUserProfile.wallet_balance || 0) - amount;
            
            await supabase.from('withdrawals').insert([{
                user_id: currentUserProfile.id,
                amount: amount,
                upi_id: upi,
                status: 'pending'
            }]);

            await supabase.from('profiles').update({ 
                wallet_balance: newBal, 
                upi_id: upi 
            }).eq('id', currentUserProfile.id);

            currentUserProfile.wallet_balance = newBal;
            updateWalletUI(newBal);

            alert("Withdrawal Requested Successfully!");
            closeModal('withdrawModal');
        } catch (err) {
            console.error(err);
            alert("Withdrawal failed: " + err.message);
        } finally {
            btn.innerText = "Withdraw ⚡";
            btn.disabled = false;
        }
    };

    // INITIAL LOAD
    window.onload = async () => {
        const savedId = localStorage.getItem('rem_user_id');
        if (!savedId) {
            document.getElementById('authModal').style.display = 'flex';
        } else {
            const { data: profile } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', savedId)
                .maybeSingle();

            if (profile) {
                currentUserProfile = profile;
                updateWalletUI(profile.wallet_balance || 0);
                loadTasks();
            } else {
                document.getElementById('authModal').style.display = 'flex';
            }
        }
    };
</script>
</body>
</html>
